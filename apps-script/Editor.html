<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;margin:0;background:#f5f6f8;color:#0a1b37}header{background:#0a1b37;color:white;padding:18px}main{padding:16px;max-width:640px;margin:auto}label{display:block;margin:12px 0 4px;font-weight:600}input,select,textarea,button{box-sizing:border-box;width:100%;padding:13px;font:inherit;border:1px solid #ccd2d9;border-radius:8px}button{background:#0a1b37;color:white;margin:14px 0;border:0;font-weight:700}small{color:#586477}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel{background:white;padding:16px;border-radius:12px;margin:14px 0}#message{padding:10px}</style></head><body><header><b>Cooper's Cricket Journey</b><div>Private score editor</div></header><main><div id="message">Loading matches…</div><div class="panel"><label>Existing match</label><select id="choose"><option value="">New match</option></select><form id="form"><label>Opposition</label><input name="opponent" required><label>Date</label><input name="matchDate" type="date" required><label>Season</label><input name="season" placeholder="2026/27"><label>Venue</label><input name="venue"><label>Match status</label><select name="recordStatus"><option value="manual">Manual</option><option value="incomplete">Incomplete</option><option value="complete">Complete</option><option value="awaiting">Awaiting PlayCricket</option><option value="verified">Verified</option></select><label>PlayCricket URL (optional)</label><input name="playCricketUrl" type="url"><div class="row" id="stats"></div><label>Notes</label><textarea name="notes" rows="3"></textarea><button>Save to Google Sheets</button></form></div></main><script>
const keys=['runs','balls','dismissals','fours','sixes','wickets','conceded','bowlingBalls','catches','runouts'];let matches=[],editing=null;
document.getElementById('stats').innerHTML=keys.map(k=>'<div><label>'+k+'</label><input name="'+k+'" type="number" min="0" inputmode="numeric" placeholder="Unknown"></div>').join('');
function showError(e){document.getElementById('message').textContent=e.message||String(e)}
function refresh(){google.script.run.withSuccessHandler(ms=>{matches=ms;document.getElementById('choose').innerHTML='<option value="">New match</option>'+ms.map(m=>'<option value="'+m.id+'">'+String(m.matchDate||'')+' · '+String(m.opponent||'')+'</option>').join('');document.getElementById('message').textContent=ms.length+' matches loaded';}).withFailureHandler(showError).editorMatches()}
document.getElementById('choose').onchange=e=>{editing=matches.find(m=>String(m.id)===e.target.value)||null;document.getElementById('form').reset();if(editing)for(const el of document.getElementById('form').elements)if(el.name&&editing[el.name]!==null&&editing[el.name]!==undefined)el.value=editing[el.name]};
document.getElementById('form').onsubmit=e=>{e.preventDefault();const p=Object.assign({},editing||{});for(const el of e.target.elements){if(!el.name)continue;if(keys.includes(el.name)){p[el.name]=el.value===''?null:Number(el.value)}else p[el.name]=el.value}p.unknownFields=keys.filter(k=>p[k]===null);p.fieldSources=Object.assign({},p.fieldSources||{});keys.forEach(k=>{if(p[k]!==null&&(!editing||editing[k]!==p[k]))p.fieldSources[k]='manual'});document.getElementById('message').textContent='Saving…';google.script.run.withSuccessHandler(()=>{editing=null;refresh()}).withFailureHandler(showError).saveMatch(p)};
refresh();
</script></body></html>
