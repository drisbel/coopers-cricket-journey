<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;margin:0;background:#f5f6f8;color:#0a1b37}header{background:#0a1b37;color:white;padding:18px}main{padding:16px;max-width:640px;margin:auto}label{display:block;margin:12px 0 4px;font-weight:600}input,select,textarea,button{box-sizing:border-box;width:100%;padding:13px;font:inherit;border:1px solid #ccd2d9;border-radius:8px}button{background:#0a1b37;color:white;margin:14px 0;border:0;font-weight:700}small{color:#586477}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scorebuttons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.scorebuttons button{margin:3px 0;padding:12px 3px}.secondary{background:#e4e8ef;color:#0a1b37}.panel{background:white;padding:16px;border-radius:12px;margin:14px 0}#message{padding:10px}</style></head><body><header><b>Cooper's Cricket Journey</b><div>Match Editor</div></header><main><div id="message">Loading matches…</div><div class="panel" id="matchEditor"><h2>Create / Save Match</h2><label>Existing match</label><select id="choose"><option value="">New match</option></select><form id="form"><label>Opposition</label><input name="opponent" required><label>Date</label><input name="matchDate" type="date" required><label>Season</label><input name="season" placeholder="2026/27"><label>Match result</label><select name="result"><option value="">Not recorded</option><option>Win</option><option>Loss</option><option>Draw</option><option>No result</option></select><label>Team overs (if known)</label><input name="teamOvers" type="number" min="0" placeholder="Unknown"><label>Venue</label><input name="venue"><label>Match status</label><select name="recordStatus"><option value="manual">Manual</option><option value="incomplete">Incomplete</option><option value="complete">Complete</option><option value="awaiting">Awaiting PlayCricket</option><option value="verified">Verified</option></select><label>PlayHQ / PlayCricket URL (optional)</label><input name="playCricketUrl" type="url"><div class="row" id="stats"></div><div class="row"><div><h3>Finalise Match (after play)</h3><label>Donnybrook runs</label><input name="ourScore" type="number" min="0" placeholder="Unknown"></div><div><label>Donnybrook wickets</label><input name="ourWickets" type="number" min="0" placeholder="Unknown"></div><div><label>Opposition runs</label><input name="opponentScore" type="number" min="0" placeholder="Unknown"></div><div><label>Opposition wickets</label><input name="opponentWickets" type="number" min="0" placeholder="Unknown"></div></div><label>Official scorecard availability</label><select name="scorecardAvailability"><option value="unknown">Unknown</option><option value="not_available">Not available</option><option value="awaiting">Awaiting upload</option><option value="available">Available</option></select><label>Notes</label><textarea name="notes" rows="3"></textarea><button id="saveMatchBtn" type="submit">Save to Google Sheets</button><div id="saveFeedback" role="status" aria-live="polite"></div></form></div><div class="panel" id="scoring" style="display:none"><h2>Live Scoring</h2><label for="scoreChoose">Select match</label><select id="scoreChoose"><option value="">Select a saved match</option></select><div id="syncState" role="status" aria-live="polite"></div><h3>Batting <span id="batSummary"></span></h3><div class="scorebuttons" id="batButtons"></div><h3>Bowling <span id="bowlSummary"></span></h3><div class="scorebuttons" id="bowlButtons"></div><div class="row"><button type="button" id="undoScore" class="secondary">Undo last</button><button type="button" id="clearScore" class="secondary">Clear session</button></div><button type="button" id="retryScore">Recalculate and sync match figures</button></div></main><script>
const teamKeys=['ourScore','ourWickets','opponentScore','opponentWickets'];const keys=['runs','balls','dismissals','fours','sixes','wickets','conceded','bowlingBalls','catches','runouts'];let matches=[],editing=null;
document.getElementById('stats').innerHTML=keys.map(k=>'<div><label>'+k+'</label><input name="'+k+'" type="number" min="0" inputmode="numeric" placeholder="Unknown"></div>').join('');
function showError(e){const message=e&&e.message||String(e);document.getElementById('message').textContent=message;document.getElementById('saveFeedback').textContent='Save failed: '+message;const b=document.getElementById('saveMatchBtn');b.disabled=false;b.textContent='Save to Google Sheets'}
function refresh(){google.script.run.withSuccessHandler(ms=>{matches=ms;document.getElementById('choose').innerHTML='<option value="">New match</option>'+ms.map(m=>'<option value="'+m.id+'">'+String(m.matchDate||'')+' · '+String(m.opponent||'')+'</option>').join('');document.getElementById('scoreChoose').innerHTML='<option value="">Select a saved match</option>'+ms.map(m=>'<option value="'+m.id+'">'+String(m.matchDate||'')+' · '+String(m.opponent||'')+'</option>').join('');document.getElementById('message').textContent=ms.length+' matches loaded';if(activeMatchId){document.getElementById('choose').value=activeMatchId;document.getElementById('scoreChoose').value=activeMatchId;editing=ms.find(m=>String(m.id)===activeMatchId)||null;}}).withFailureHandler(showError).editorMatches()}
document.getElementById('saveMatchBtn').addEventListener('click',()=>{document.getElementById('saveFeedback').textContent='Save button clicked — checking required fields…'});
document.getElementById('form').addEventListener('invalid',e=>{document.getElementById('saveFeedback').textContent='Please complete the required field: '+(e.target.previousElementSibling?.textContent||e.target.name)},true);
document.getElementById('scoreChoose').onchange=e=>{document.getElementById('choose').value=e.target.value;document.getElementById('choose').onchange({target:document.getElementById('choose')})};
document.getElementById('choose').onchange=e=>{if(pending)return alert('Wait for the current sync to finish or retry it before switching matches');activeMatchId=e.target.value;document.getElementById('scoreChoose').value=activeMatchId;editing=matches.find(m=>String(m.id)===e.target.value)||null;document.getElementById('form').reset();if(editing)for(const el of document.getElementById('form').elements)if(el.name&&editing[el.name]!==null&&editing[el.name]!==undefined)el.value=editing[el.name];loadSelectedSession()};
document.getElementById('form').onsubmit=e=>{e.preventDefault();const btn=document.getElementById('saveMatchBtn');btn.disabled=true;btn.textContent='Saving…';document.getElementById('saveFeedback').textContent='Saving match to Google Sheets…';const p=Object.assign({},editing||{});for(const el of e.target.elements){if(!el.name)continue;if(keys.includes(el.name)||teamKeys.includes(el.name)){p[el.name]=el.value===''?null:Number(el.value)}else p[el.name]=el.value}p.unknownFields=keys.filter(k=>p[k]===null);p.fieldSources=Object.assign({},p.fieldSources||{});keys.forEach(k=>{if(p[k]!==null&&(!editing||editing[k]!==p[k]))p.fieldSources[k]='manual'});document.getElementById('message').textContent='Saving…';if(!window.google||!google.script||!google.script.run){showError(new Error('Google Apps Script connection unavailable. Open the editor directly instead of inside the website.'));return}google.script.run.withSuccessHandler(res=>{activeMatchId=res.id;editing=Object.assign({},p,{id:res.id});btn.disabled=false;btn.textContent='Save to Google Sheets';document.getElementById('saveFeedback').textContent='✓ Match saved successfully to Google Sheets';refresh();loadSelectedSession()}).withFailureHandler(showError).saveMatch(p)};

const SESSION_KEY='cooper-live-pending-v2';let activeMatchId='',events=[],pending=false,dirty=false,revision=0;
function status(s){document.getElementById('syncState').textContent=s}
function key(){return SESSION_KEY+':'+activeMatchId}
function readPending(){try{const x=JSON.parse(localStorage.getItem(key())||'null');return Array.isArray(x)?x:null}catch{return null}}
function storePending(){if(activeMatchId)localStorage.setItem(key(),JSON.stringify(events))}
function loadSelectedSession(){
 events=[];revision++;
 if(!activeMatchId){paintSession();status('Save a new match or select an existing match to start scoring.');return}
 const token=revision,local=readPending();
 if(local){events=local;paintSession();status('Unsynced session recovered on this device. Retrying…');dirty=true;flush();return}
 status('Loading saved deliveries…');
 google.script.run.withSuccessHandler(rows=>{if(token!==revision)return;events=rows;paintSession();status('Saved session loaded · '+rows.length+' deliveries')}).withFailureHandler(e=>{if(token===revision)status('Could not load deliveries: '+(e.message||e))}).liveSession(activeMatchId);
}
const batting=[['0',0],['1',1],['2',2],['3',3],['4',4],['6',6],['OUT','out'],['Wide','wide'],['No ball','noball'],['Bye','bye'],['Leg bye','legbye'],['Extra (legacy)','extra']];
const bowling=[['Dot',0],['1',1],['2',2],['3',3],['4',4],['6',6],['Wide','wide'],['No ball','noball'],['Wicket','wicket'],['Bye +1','bye'],['Leg bye +1','legbye']];
function totals(){let a={runs:0,balls:0,allocationUsed:0,dismissals:0,fours:0,sixes:0,wickets:0,conceded:0,bowlingBalls:0};events.forEach(e=>{if(e.side==='bat'){a.allocationUsed++;if(typeof e.value==='number'){a.runs+=e.value;a.balls++;if(e.value===4)a.fours++;if(e.value===6)a.sixes++}else if(e.value==='out'){a.dismissals++;a.balls++}}else{if(typeof e.value==='number'){a.conceded+=e.value;a.bowlingBalls++}else if(e.value==='wicket'){a.wickets++;a.bowlingBalls++}else if(e.value==='wide'||e.value==='noball'){a.conceded++;a.bowlingBalls++;}else if(e.value==='bye'||e.value==='legbye')a.bowlingBalls++}});return a}
function paintSession(){let t=totals();document.getElementById('batSummary').textContent=t.runs+' ('+t.balls+') · '+t.allocationUsed+' deliveries used · '+t.dismissals+' out';document.getElementById('bowlSummary').textContent=t.wickets+'/'+t.conceded+' · '+Math.floor(t.bowlingBalls/6)+'.'+t.bowlingBalls%6+' overs'}
function changed(){if(!activeMatchId){status('Create or select a match first.');return}storePending();dirty=true;paintSession();status('Saving to Google Sheets…');flush()}
function flush(){if(pending||!dirty||!activeMatchId)return;pending=true;dirty=false;const id=activeMatchId,snapshot=JSON.parse(JSON.stringify(events)),token=revision;
 google.script.run.withSuccessHandler(()=>{pending=false;if(token!==revision)return;if(!dirty){localStorage.removeItem(key());status('All '+snapshot.length+' deliveries saved to Google Sheets')}else flush()}).withFailureHandler(e=>{pending=false;dirty=true;status('Not synced — saved on this device. Retry when connected. '+(e.message||e))}).syncLiveSession(id,snapshot);
}
function buttons(id,side,items){document.getElementById(id).innerHTML=items.map(([label,v],i)=>'<button type="button" data-score="'+i+'">'+label+'</button>').join('');document.querySelectorAll('#'+id+' [data-score]').forEach(b=>b.onclick=()=>{if(!activeMatchId)return alert('Save or select a match first');events.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),side,value:items[Number(b.dataset.score)][1]});changed()})}
buttons('batButtons','bat',batting);buttons('bowlButtons','bowl',bowling);paintSession();
document.getElementById('undoScore').onclick=()=>{if(events.length){events.pop();changed()}};
document.getElementById('clearScore').onclick=()=>{if(!activeMatchId)return;if(confirm('Delete ALL recorded deliveries for this match?')){events=[];changed()}};
document.getElementById('retryScore').onclick=()=>{if(!activeMatchId)return status('Select a saved match first');storePending();dirty=true;status('Recalculating match totals from deliveries…');flush()};
window.addEventListener('online',()=>{if(dirty)flush()});


refresh();
</script></body></html>
